[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motionbreak"
version = "0.1.0"
description = "Reproduce and minimise UI transition failures with explicit browser contracts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["playwright==1.63.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
motionbreak = "motionbreak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Docker or a Chromium browser"]

[project.urls]
Repository = "https://github.com/beweiskette/motionbreak"
